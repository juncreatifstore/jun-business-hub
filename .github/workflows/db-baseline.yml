name: DB — generate baseline migration

# One-off: squash the (drifted) migration history into a single baseline
# generated from prisma/schema.prisma. Old migrations are archived, not deleted.
# Result is pushed to branch chore/baseline-migrations for review.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate baseline from schema
        run: |
          set -e
          STAMP=$(date -u +%Y%m%d%H%M)
          mkdir -p prisma/migrations_archive
          git mv prisma/migrations/* prisma/migrations_archive/ 2>/dev/null || true
          mkdir -p "prisma/migrations/${STAMP}_baseline"
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "prisma/migrations/${STAMP}_baseline/migration.sql"
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          git mv prisma/migrations_archive/migration_lock.toml prisma/migrations_archive/migration_lock.toml.old 2>/dev/null || true
          echo "BASELINE=${STAMP}_baseline" >> "$GITHUB_ENV"
          wc -l "prisma/migrations/${STAMP}_baseline/migration.sql"
      - name: Verify the baseline reproduces the schema (empty shadow DB)
        run: |
          docker run -d --name pg -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ci && break; sleep 1; done
          npx prisma migrate deploy
          PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d ci -c 'CREATE DATABASE ci_shadow' >/dev/null
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://ci:ci@127.0.0.1:5432/ci_shadow --exit-code
          echo "drift: none"
      - name: Push for review
        run: |
          git config user.name "jun-ci" && git config user.email "ci@jun.local"
          git checkout -q -B chore/baseline-migrations
          git add -A prisma
          git commit -qm "db: baseline migration ${BASELINE} generated from schema; drifted history archived"
          git push -f origin chore/baseline-migrations
