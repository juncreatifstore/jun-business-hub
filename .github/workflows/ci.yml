name: JUN Business Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NEXT_PUBLIC_APP_URL: https://www.juncreatif.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

# Diagnostic PR trigger for Mail Phase 5 build validation.
# Rerun after sanitizer hardening.
# Rerun after Mail metadata type narrowing.
