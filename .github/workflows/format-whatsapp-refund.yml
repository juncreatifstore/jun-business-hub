name: Format WhatsApp refund integration

on:
  push:
    branches:
      - feature/whatsapp-refund-request-link

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/whatsapp-refund-request-link

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write components/whatsapp/template-composer.tsx services/whatsapp-refund-claim.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/whatsapp/template-composer.tsx services/whatsapp-refund-claim.ts
          git commit -m "Format WhatsApp refund integration"
          git push origin HEAD:feature/whatsapp-refund-request-link
